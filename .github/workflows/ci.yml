name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
      - run: python -m thought_diff compare examples/original examples/working
      - run: python -m thought_diff compare examples/original examples/working --json
      - run: python -m thought_diff_app --check --no-browser
      - run: python -m thought_diff_app --help
